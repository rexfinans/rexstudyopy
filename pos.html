<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REX Smart POS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-y:hidden}
#view{position:absolute;left:0;top:0;right:0;overflow:hidden}
[hidden]{display:none!important}
#guide{display:none;position:absolute;inset:0;z-index:60;pointer-events:none}
#guide.on{display:block}
#guide .gb{position:absolute;left:0;right:0;bottom:0;height:22%;background:rgba(255,40,40,.13);border-top:3px dashed #ff4d4d}
#guide .gr{position:absolute;top:0;bottom:0;right:0;width:14%;background:rgba(255,40,40,.11);border-left:3px dashed #ff4d4d}
#guide span{position:absolute;color:#ff8a8a;font:800 22px Arial;text-shadow:0 0 4px #000}
#stage{position:absolute;left:50%;top:0;width:1080px;height:1920px;transform-origin:top center;transform:translate(-50%,0);font-family:Arial,Helvetica,sans-serif}

/* ---------- POS CİHAZI (yüklenen dosyanın ölçüleri: 440 x 290, ekran 204) ---------- */
.device{position:absolute;left:50%;margin-left:-220px;top:150px;width:440px;height:290px;padding:12px;z-index:2;border-radius:27px 27px 20px 20px;
  background:radial-gradient(ellipse at 50% -15%,rgba(154,206,255,.3),transparent 55%),linear-gradient(135deg,#303d50 0%,#111a29 28%,#080f1a 72%,#26364a 100%);
  border:1px solid rgba(190,218,245,.58);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.38),inset 0 -13px 22px rgba(0,0,0,.6),0 5px 0 #050910,0 14px 25px rgba(0,0,0,.28)}
.device::before{content:"";position:absolute;left:9px;right:9px;top:5px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.dev-head{position:absolute;left:12px;right:12px;top:12px;height:27px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;color:#eaf6ff;font-size:10px;font-weight:900;letter-spacing:2.4px}
.logo-mark{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;color:#061722;font-size:12px;font-weight:1000;background:linear-gradient(135deg,#75ffe1,#28aee9);box-shadow:0 0 15px rgba(70,226,220,.4)}
.link{display:flex;align-items:center;gap:6px;font-size:8px;font-weight:800;letter-spacing:1px;color:#9cf8d7}
.led{width:6px;height:6px;border-radius:50%;background:#54f7ac;box-shadow:0 0 9px #54f7ac}
.link.offline{color:#ff9a8a}.link.offline .led{background:#ff6a5a;box-shadow:0 0 9px #ff6a5a}
.link.connecting{color:#ffd77a}.link.connecting .led{background:#ffc94d;box-shadow:0 0 9px #ffc94d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.bezel{position:absolute;left:12px;right:12px;top:40px;height:204px;padding:7px;border-radius:17px;background:linear-gradient(145deg,#030811,#3b4a5d 48%,#070d17);border:1px solid #62758b;box-shadow:inset 0 4px 9px #000,0 1px 2px rgba(255,255,255,.15)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:11px;container-type:size;color:#e9f7ff;
  background:radial-gradient(circle at 90% 0%,rgba(40,196,224,.22),transparent 42%),radial-gradient(circle at 0% 100%,rgba(93,103,255,.18),transparent 45%),linear-gradient(145deg,#10263c,#071422 68%,#102a3a);
  box-shadow:inset 0 0 22px rgba(44,202,234,.13)}
.screen::before{content:"";position:absolute;inset:0;z-index:26;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.13) 0%,transparent 34%)}
.screen::after{content:"";position:absolute;inset:0;z-index:27;pointer-events:none;opacity:.09;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px)}

.idle{position:absolute;inset:0;padding:11px 13px;display:flex;flex-direction:column;justify-content:space-between}
.idle-top{display:flex;justify-content:space-between;font-size:7px;font-weight:800;letter-spacing:1.2px;color:#9eb9cc}
.idle-main{text-align:center}
.idle-mark{font-size:26px;color:#73e8d6;text-shadow:0 0 16px rgba(115,232,214,.6)}
.idle-title{margin-top:4px;font-size:14px;font-weight:900;letter-spacing:2px}
.idle-sub{margin-top:4px;font-size:9px;color:#9bc3d6}
.idle-stats{display:flex;justify-content:space-around;text-align:center}
.idle-stats b{display:block;font-size:17px;color:#6bffd0}
.idle-stats span{font-size:7px;letter-spacing:1.5px;color:#8caec0}
.idle-foot{font-size:7px;letter-spacing:1.5px;color:#72f3c8;text-align:center}
.meter{height:4px;margin:5px auto 0;width:70%;border-radius:4px;background:#1d3146;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#31a9ff,#6bffd0)}

/* Hediye: anında ekranda, ekranın tamamına sığan kart (cqh/cqw ile ölçeklenir) */
#gift{position:absolute;inset:0;z-index:20;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;justify-items:center;align-items:center;gap:2.5cqh;padding:3.5cqh 4cqw;text-align:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,206,110,.38),transparent 55%),radial-gradient(circle at 50% 110%,rgba(255,96,70,.26),transparent 60%),linear-gradient(155deg,#2f2344,#111629 60%,#3a2418);
  animation:giftIn .4s cubic-bezier(.16,.8,.2,1) both}
@keyframes giftIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.gift-top{font-size:3.4cqh;font-weight:900;letter-spacing:.4cqw;color:#ffe2a6}
.gift-photo{min-height:0;height:100%;display:flex;align-items:center;justify-content:center;max-width:100%}
.gift-avatar{width:58cqw;aspect-ratio:2/1;max-width:90cqw;object-fit:cover;object-position:50% 18%;border-radius:2.5cqh;border:.6cqh solid #ffd98c;background:#1a1530;box-shadow:0 0 4cqh rgba(255,190,90,.5)}
.gift-name{max-width:94cqw;font-size:6cqh;font-weight:900;color:#fff;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gift-item{display:flex;align-items:center;gap:3cqw;max-width:94cqw}
.gift-emoji{font-size:9cqh;line-height:1}
.gift-item b{display:block;font-size:4.6cqh;color:#ffe9b8;overflow-wrap:anywhere}
.gift-item small{display:block;font-size:5cqh;font-weight:900;color:#ffd477}
.gift-bar{position:absolute;left:4cqw;right:4cqw;bottom:1.8cqh;height:1cqh;border-radius:1cqh;background:rgba(255,255,255,.15);overflow:hidden}
.gift-bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ffb84d,#ffe69a);transform-origin:left}

.keys{position:absolute;left:12px;right:12px;top:252px;height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.key{display:flex;align-items:center;gap:5px;font-size:7px;font-weight:800;letter-spacing:1px;color:#8193a6}
.key i{width:5px;height:5px;border-radius:50%;background:#4be8bf;box-shadow:0 0 6px #4be8bf}

/* Çıkış ağzı (yüklenen dosyadaki gibi: 343 x 17) */
.lip{position:absolute;left:50%;margin-left:-171.5px;top:436px;width:343px;height:17px;z-index:4;border-radius:0 0 8px 8px;border:1px solid #6e7c8b;border-top:0;background:linear-gradient(#090e17,#02050a 65%,#293443);box-shadow:0 4px 8px rgba(0,0,0,.48)}
.lip::after{content:"";position:absolute;left:5%;right:5%;top:1px;height:4px;border-radius:4px;background:#000;box-shadow:0 1px 3px #82909c}
.lip.busy::before{content:"";position:absolute;left:50%;top:-9px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:#6bffd0;box-shadow:0 0 10px #6bffd0;animation:blink .5s infinite}

/* Gerçek termal fiş şeridi: beyaz kağıt, kesim çizgileri, satırlar kendi yüksekliğinde */
.paper-layer{position:absolute;left:0;top:440px;width:1080px;height:1480px;overflow:hidden;z-index:1;pointer-events:none}
.strip{position:absolute;left:50%;top:0;width:317px;margin-left:-158.5px;display:flex;flex-direction:column}
.row{width:317px;flex:0 0 auto;box-sizing:border-box;padding:10px 14px 14px;box-shadow:inset 0 -3px 4px -3px rgba(0,0,0,.2);color:#1d1a16;font-family:"Courier New",Courier,monospace;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .035 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), linear-gradient(90deg,rgba(0,0,0,.025),transparent 6%,transparent 94%,rgba(0,0,0,.025)),#fcfcfa;border-bottom:2px dashed #8f8f8f}
.row-meta{text-align:right;font-size:12px;color:#666;letter-spacing:1px}
.row-main{display:flex;align-items:center;gap:12px;margin-top:4px}
.row-av{width:84px;height:84px;flex:0 0 84px;border-radius:50%;object-fit:cover;border:2px solid #1d1a16;background:#ddd;filter:grayscale(.3) contrast(1.1)}
.row-photo{width:100%;height:145px;margin:4px 0 10px;border:2px solid #1d1a16;background:#f4f4f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.row-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:none}
.row-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row-name{font-size:21px;font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.row-ev{font-size:13px;font-weight:700;letter-spacing:1px;color:#111}
.row.gift .row-ev{color:#8a5a00}
.row.follow .row-ev{color:#1b7f3b}
.row.share .row-ev{color:#7a2fb5}
.row.comment .row-ev{color:#0b5cad}
.row-gift{font-size:17px;font-weight:700;color:#8a5a00;overflow-wrap:anywhere}
.row-band{background:#111;color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:3px;padding:4px 0;margin:4px 0 6px}
.row-txt{margin-top:8px;font-size:16px;font-weight:700;color:#0b5cad;overflow-wrap:anywhere;line-height:1.3}

.paper-layer::before{content:"";position:absolute;left:50%;top:0;width:317px;margin-left:-158.5px;height:28px;background:linear-gradient(rgba(0,0,0,.32),transparent);z-index:2;pointer-events:none}
.lg{position:absolute;z-index:6;display:flex;flex-direction:column;gap:16px;pointer-events:none;font-family:Arial,Helvetica,sans-serif;align-items:center;text-align:center}
#lgR{right:170px;top:430px;width:210px}
#lgL{left:22px;top:430px;width:250px}
.lg div{font-size:20px;font-weight:900;color:#fff;letter-spacing:.5px;text-shadow:0 0 4px #000,0 0 4px #000,0 0 3px #000;line-height:1.15}
.lg i{display:block;font-style:normal;font-size:40px;line-height:1.1;filter:drop-shadow(0 2px 3px #0008)}
.lg small{display:block;font-size:14px;font-weight:700;color:#ffe6a8;letter-spacing:.3px;margin-top:2px}

/* ===== Eklenenler: ikonlar, hediye kartları, hedefler, telefon düzeni, test ===== */
.emo{display:inline-block;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gico{object-fit:contain;display:block}
.lg i img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
.lg i .emo{font-size:40px}
.gift-emoji{display:flex;align-items:center;justify-content:center;min-width:9cqh;height:9cqh}
.gift-emoji img{height:9cqh;width:9cqh}
.gift-emoji .emo{font-size:9cqh}
.idle-sub.flash{animation:flashNew .9s ease-out}
@keyframes flashNew{0%{color:#fff;text-shadow:0 0 12px #6bffd0;transform:scale(1.06)}100%{color:#9bc3d6;text-shadow:none;transform:none}}
.row-giftline{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#8a5a00}
.row-giftline img{width:34px;height:34px;filter:grayscale(1) contrast(1.3)}
.row-giftline .emo{font-size:28px;filter:grayscale(1)}
#gfeed{position:absolute;left:320px;top:6px;width:440px;display:flex;flex-direction:column;gap:6px;z-index:7;pointer-events:none}
.gf{position:relative;display:flex;align-items:center;gap:10px;padding:7px 12px 7px 8px;border-radius:16px;color:#fff;font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,rgba(18,20,28,.94),rgba(54,34,16,.92));border:1px solid rgba(255,190,110,.42);box-shadow:0 8px 22px rgba(0,0,0,.4);
  animation:gfIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.gf.out{animation:gfOut .4s ease forwards}
.gf.big{border-color:#ffd36a;box-shadow:0 0 22px rgba(255,200,90,.6),0 8px 22px rgba(0,0,0,.4)}
.gf .gi{width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;flex:none}
.gf .gi img{width:44px;height:44px;object-fit:contain}
.gf .gi .emo{font-size:34px}
.gf .gt{min-width:0;flex:1}
.gf .gt small{display:block;font-size:12px;color:#cfd6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf .gt b{display:block;font-size:18px;color:#ffd58a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gf .gn{font-size:21px;font-weight:900;color:#7ff0ff;flex:none}
.gf.pop .gn{animation:gnPop .35s}
@keyframes gfIn{from{opacity:0;transform:translateX(-26px) scale(.92)}to{opacity:1;transform:none}}
@keyframes gfOut{to{opacity:0;transform:translateX(-20px) scale(.95)}}
@keyframes gnPop{50%{transform:scale(1.55)}}
#goals{position:absolute;left:775px;top:48px;width:150px;display:flex;flex-direction:column;gap:10px;z-index:7;pointer-events:none;font-family:Arial,Helvetica,sans-serif}
.goal{padding:8px 10px;border-radius:12px;background:rgba(10,14,22,.84);border:1px solid rgba(120,200,255,.35);color:#fff}
.goal b{display:block;font-size:11px;letter-spacing:1px;color:#9fdcff}
.goal span{display:block;font-size:14px;font-weight:900;margin-top:2px}
.goal i{display:block;height:7px;border-radius:7px;background:#1d3146;margin-top:5px;overflow:hidden}
.goal i u{display:block;height:100%;width:0;text-decoration:none;background:linear-gradient(90deg,#31a9ff,#6bffd0);transition:width .6s}
.goal.done i u{background:linear-gradient(90deg,#ffb84d,#ffe69a)}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9998;padding:8px 16px;border-radius:99px;background:rgba(14,15,19,.85);border:1px solid rgba(255,255,255,.25);color:#fff;font:700 13px Arial;pointer-events:none}
#testbar{position:fixed;left:0;right:0;bottom:0;z-index:9997;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;background:rgba(10,12,18,.88)}
#testbar button{border:1px solid #3a6a8a;background:#12283a;color:#fff;border-radius:8px;padding:9px 12px;font:700 13px Arial}

/* yan listeler: modern cam kartlar, solda 4 hediye, sağda 4 etkileşim */
.lg{gap:8px;align-items:stretch;text-align:left}
#lgL{left:22px;top:158px;width:210px}
#lgR{left:775px;right:auto;top:158px;width:150px}
.lg div{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 7px;border-radius:16px;font-size:15px;font-weight:800;line-height:1.1;letter-spacing:.3px;color:#fff;text-shadow:none;
  background:linear-gradient(135deg,rgba(18,26,44,.80),rgba(10,14,26,.72));border:1px solid rgba(140,200,255,.24);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.lg i{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-size:24px;line-height:1;filter:none}
.lg i img{width:30px;height:30px;object-fit:contain}
.lg i .emo{font-size:24px}
.lg span{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg small{display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.8px;color:#7fe6ff}
/* HD tam profil: renkli, kırpmasız kareye yakın */
.row-photo{height:240px}
.row-photo img{object-position:50% 30%;filter:none; image-rendering: -webkit-optimize-contrast;}
.row-av{width:96px;height:96px;flex:0 0 96px;filter:none; image-rendering: -webkit-optimize-contrast;}
.gift-photo{min-height:0;height:100%}
.gift-avatar{width:auto;height:100%;aspect-ratio:1/1;max-width:90cqw;object-fit:cover;object-position:50% 30%; image-rendering: -webkit-optimize-contrast;}
#hint{left:12px;transform:none;bottom:12px;padding:5px 12px;font:700 11px Arial}
body.narrow #gfeed{left:160px;top:6px;width:760px;gap:4px}
body.narrow .gf{padding:3px 10px 3px 6px}
body.narrow .gf .gi{width:34px;height:34px}
body.narrow .gf .gi img{width:28px;height:28px}
body.narrow .gf .gi .emo{font-size:22px}
body.narrow .gf .gt b{font-size:14px}
body.narrow .gf .gt small{font-size:10px}
body.narrow #lgL{left:164px;width:152px;gap:6px}
body.narrow #lgR{left:764px;width:152px;gap:6px}
body.narrow .lg div{font-size:13px;gap:6px;padding:5px 7px 5px 5px;border-radius:13px}
body.narrow .lg i{width:30px;height:30px;font-size:19px;border-radius:9px}
body.narrow .lg i img{width:22px;height:22px}
body.narrow .lg i .emo{font-size:19px}
body.narrow .lg small{font-size:9px;margin-top:2px}
html,body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}

/* ===== v2: HD profil, performans, fiş istatistikleri, liderlik, hedef ===== */
.row-av,.row-photo img,.gift-avatar,#lb img{image-rendering:auto;transform:translateZ(0);backface-visibility:hidden}
.strip{will-change:transform}.row{contain:layout style}
.lg div{backdrop-filter:none;background:linear-gradient(135deg,rgba(18,26,44,.92),rgba(10,14,26,.88))}
.row-stats{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:8px;padding-top:6px;border-top:2px dashed #1d1a16;font-size:12px;font-weight:700;letter-spacing:.5px;color:#222}
.row-stats span:first-child:is(.up){color:#000}
#lb{position:absolute;left:22px;top:430px;width:210px;z-index:6;pointer-events:none;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;gap:6px}
#lb small{font-size:11px;font-weight:900;letter-spacing:1px;color:#ffd98c;text-shadow:0 0 4px #000}
.lbr{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 5px;border-radius:14px;color:#fff;background:linear-gradient(135deg,rgba(18,26,44,.92),rgba(10,14,26,.88));border:1px solid rgba(140,200,255,.24)}
.lbr.k{border-color:#ffd36a;box-shadow:0 0 14px rgba(255,200,90,.45)}
.lbr img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#1a1530}
.lbr span{min-width:0;flex:1;display:flex;flex-direction:column}
.lbr b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbr em{font-style:normal;font-size:10px;color:#7fe6ff;white-space:nowrap}
.lbr u{text-decoration:none;font-size:13px;font-weight:900;color:#ffd58a}
#goals{left:775px;top:430px;width:150px}
#fps{position:fixed;left:6px;top:6px;z-index:9999;padding:2px 8px;border-radius:6px;background:#000a;color:#6bffd0;font:700 12px Arial;pointer-events:none}
body.narrow #lb{left:164px;width:152px;gap:4px}body.narrow .lbr img{width:26px;height:26px}body.narrow .lbr b{font-size:11px}
body.narrow #goals{left:764px;width:152px}

/* liderlik = küçük termal fiş */
#lb{left:22px;top:430px;width:200px;padding:8px 10px 10px;gap:2px;background:#fbfbf8;color:#1d1a16;font-family:"Courier New",Courier,monospace;box-shadow:0 8px 18px rgba(0,0,0,.4)}
#lb::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fbfbf8 25%,transparent 25%) -4px 0,linear-gradient(225deg,#fbfbf8 25%,transparent 25%) -4px 0;background-size:8px 8px}
.lbh{text-align:center;font-size:12px;font-weight:900;letter-spacing:1px}
.lbs{text-align:center;font-size:9px;color:#666;letter-spacing:1px;padding-bottom:4px;border-bottom:2px dashed #1d1a16;margin-bottom:2px}
.lbr{border-radius:0;border:0;border-bottom:1px dashed #1d1a16;background:none;box-shadow:none;color:#1d1a16;padding:4px 0;gap:7px}

const TIPS = ["♥ Beğeni at, fişinde kaç beğeni attığın yazsın", "★ Hediye gönder, ekranda adın parlasın", "➕ Takip et, fişini al", "✎ Yorum yaz, fişine yazılsın", "🏆 En çok destek verenler listede yer alır"];

if (P("fps", false) || params.has("fps")) { const f = $("#fps"); f.hidden = false; let n = 0, t0 = performance.now(); (function L(t) { n++; if (t - t0 >= 1000) { f.textContent = n + " FPS"; n = 0; t0 = t; } requestAnimationFrame(L); })(t0); }

/* ---------- Olay alımı ---------- */
const DEF_ACT = {join: "fis", like: "buyuk", follow: "fis", share: "fis", comment: "fis", gift: "hepsi"};
function ACT(t) { try { const e = Rex.cfg.pos.ev; return (e && e[t]) || DEF_ACT[t] || "yok"; } catch (x) { return DEF_ACT[t] || "yok"; } }

function receive(raw) {
  if (!raw || typeof raw !== "object") return false;
  const t0 = String(raw.type || "join").toLowerCase();
  if (raw.stats && typeof raw.stats === "object") applyStats(raw.stats);
  if (t0 === "status") {
    try {
      const st = raw.state, since = String(raw.since || ""), old = localStorage.getItem("rex_pos_since");
      if (st === "disconnected") { resetSession(); localStorage.removeItem("rex_pos_since"); }
      else if (st === "connected" && since && since !== old) { if (old !== null) resetSession(); localStorage.setItem("rex_pos_since", since); }
    } catch (e) {}
    return false;
  }
  if (t0 === "viewers") { setViewers(raw.count); return false; }
  const ev = normalize(raw);
  if (!ev) return false;
  if (ev.type !== "like" && isDuplicate(ev)) return false;
  if (!ev.test) localCount(ev);
  ev.avatarP = loadAvatar(ev.avatar, ev.username);
  account(ev);
  lastEvt = Date.now();
  const act = ACT(ev.type);
  if (act === "yok") return true;

  const sub = $("#idleSub");
  sub.textContent = `Son: @${ev.username} • ${ev.type === "gift" ? "hediye gönderdi" : (EVENT_LABEL[ev.type] || "").toLowerCase()}`;
  sub.classList.remove("flash"); void sub.offsetWidth; sub.classList.add("flash");

  // --- BEĞENİ ---
  if (ev.type === "like") {
    const prev = ev.prevLikes, now = prev + ev.count; ev.total = now;
    let milestone = false;
    if (act === "fis") enqueue(ev);
    else if (act === "buyuk" || act === "hepsi") {
      const step = Math.max(1, P("likeBig", 10));
      if (Math.floor(now / step) > Math.floor(prev / step)) { ev.big = true; ev.total = now; enqueue(ev); milestone = true; }
    }
    
    // Beğeni ekranda gösterilsin mi?
    if (act === "ekran" || act === "hepsi") {
       ev.info = { name: "BEĞENİ", icon: "❤️" };
       ev.giftName = "like_" + ev.username;
       ev.giftCount = ev.count;
       queueGift(ev);
    }

    Sound.like();
    if (milestone && VE("like")) Voice.like(ev);
    return true;
  }

  // --- HEDİYE ---
  if (ev.type === "gift") {
    ev.info = giftInfo(ev);
    if (ev.diamonds >= 1000) shakeDev();
    ev.dur = (ev.diamonds >= 1000 ? P("bigGiftSec", 12) : P("giftSec", 5)) * 1000;
    feedAdd({key: ev.username + "|" + ev.giftName, icon: ev.info.icon, title: ev.info.name, sub: "@" + ev.username + " gönderdi",
             count: ev.giftCount, big: ev.diamonds >= 1000, ttl: ev.diamonds >= 1000 ? 10000 : 6500});
    let merged = false;
    if (act === "ekran" || act === "hepsi") merged = queueGift(ev);
    if (act === "fis" || act === "hepsi") {
      const copies = ev.giftCount >= P("bigGift", 5) ? Math.max(1, P("copies", 5)) : 1;
      for (let i = 0; i < copies; i++) enqueue(ev);
    }
    if (!merged && VE("gift")) Voice.gift(ev, false);
    return true;
  }

  // --- DİĞER ETKİLEŞİMLER (join, follow, share, comment) ---
  if (act === "ekran" || act === "hepsi") {
     let name = EVENT_LABEL[ev.type] || ev.type;
     let icon = ev.type === "follow" ? "➕" : ev.type === "share" ? "🔁" : ev.type === "comment" ? "💬" : "👤";
     ev.info = { name, icon };
     ev.giftName = ev.type + "_" + ev.username;
     ev.giftCount = ev.count || 1;
     queueGift(ev);
  }
  if (act === "fis" || act === "hepsi" || act === "buyuk") {
     if (act === "buyuk") { ev.big = true; ev.total = 0; }
     enqueue(ev);
  }
  Sound.event(ev.type);
  if (VE(ev.type) && Voice[ev.type]) Voice[ev.type](ev);
  return true;
}

/* ---------- Canlı olaylar: stüdyo sunucusunun /events akışı (SSE) ---------- */
let es = null;
function connectEvents() {
  setLink("connecting");
  try { if (es) es.close(); es = new EventSource("/events"); } catch (e) { setLink("offline"); setTimeout(connectEvents, 4000); return; }
  es.onopen = () => setLink("online");
  es.onmessage = e => {
    if (typeof e.data !== "string" || e.data.length > 20000) return;
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    receive(m);
  };
  es.onerror = () => { setLink("offline"); if (es && es.readyState === 2) setTimeout(connectEvents, 3000); };
}
connectEvents();
window.addEventListener("message", e => { if (e.data && e.data.type === "THERMAL_USER") receive(e.data.user); });

}

/* ---------- Kenar lejantı ---------- */
const ACT_LABEL = {yok: "KAPALI", fis: "FİŞ", buyuk: "BÜYÜK FİŞ", ekran: "EKRAN", hepsi: "EKRAN+FİŞ"};
const EV_LEG = [["like", "❤️", "BEĞENİ"], ["join", "💬", "KATIL"], ["follow", "➕", "TAKİP"], ["gift", "🎁", "HEDİYE"]];
const DEF_LEG_GIFTS = [["Rose,Gül", "🌹", "GÜL"], ["Finger Heart,Parmak Kalbi", "🫰", "KALP"], ["Lion,Aslan", "🦁", "ASLAN"], ["Rocket,Roket", "🚀", "ROKET"]];
const clean = v => String(v == null ? "" : v).replace(/[<>&"]/g, "");
const short = (t, n) => { t = String(t); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
const legIcon = ic => {
  ic = String(ic || "🎁");
  if (window.Rex && Rex.giftIcon) return Rex.giftIcon(ic) || '<span class="emo">🎁</span>';
  return '<span class="emo">' + clean(/^(https?:|data:)/.test(ic) ? "🎁" : ic) + "</span>";
};
let legendKey = "";
function legend() {
  const c = pcfg(), ev = c.ev || {};
  const right = EV_LEG.map(([k, i, l]) => `<div><i>${i}</i><span>${l}<small>${ACT_LABEL[ev[k] || DEF_ACT[k] || "yok"] || "KAPALI"}</small></span></div>`).join("");
  const N = Math.max(0, Math.min(8, c.lgN == null ? 4 : Number(c.lgN) || 0)), showL = c.legL !== false && N > 0, showR = c.legR !== false;
  let rows = (Array.isArray(c.gifts) ? c.gifts : []).filter(g => g && g.n && g.s !== 0 && g.s !== false).slice(0, N);
  if (!Array.isArray(c.gifts)) for (const d of DEF_LEG_GIFTS) { if (rows.length >= N) break; rows.push({n: d[0], i: d[1], _t: d[2]}); }
  const gl = ACT_LABEL[ev.gift || DEF_ACT.gift] || "FİŞ";
  const left = rows.map(g => {
    const first = String(g.n).split(",").map(s => s.trim()).filter(Boolean);
    const name = g._t || first[first.length - 1] || first[0];
    return `<div><i>${legIcon(g.i || catEmoji(first[0]))}</i><span>${clean(short(name, 12))}<small>${gl}</small></span></div>`;
  }).join("");
  const key = right + left + showL + showR;
  if (key === legendKey) return;
  legendKey = key;
  $("#lgR").innerHTML = right; $("#lgL").innerHTML = left;
  $("#lgR").hidden = !showR; $("#lgL").hidden = !showL || !rows.length;
}

function fit() {
