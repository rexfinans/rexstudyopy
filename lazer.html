<script>
(function(){"use strict";

{const R0=document.documentElement.style;R0.setProperty("--bh",(+C.barH||14)*0.12+"");const bc=C.barColor||"#38e8ff";["g_dia","g_like"].forEach(i=>{const e=$(i);if(e)e.style.setProperty("--c",bc)})}

 const LZ=(t,tam)=>{const a=Rex.evAct("lazer",t);return a==="tam"?tam:a==="yok"?[]:a==="konus"?["konus"]:[a]};
 if(ev.type==="join"){const F=LZ("join",["puan","konus"]);if(F.includes("puan"))add(o,5);if(F.includes("konus"))greet(o);if(F.includes("kalp"))hearts(6,600,1200,60);if(F.includes("patlama"))burst(450,640,16,{t:"s",v:500,g:160})}
 else if(ev.type==="comment"){const t=String(ev.text||"");add(o,3);if(BAD.test(t))return;bubble(o,t);if(dir.phase==="poll"&&!dir.d.v[o.u]){const m=t.trim().match(/^([12])\b/);if(m){dir.d.v[o.u]=1;dir.d.c[m[1]-1]++}}if(dir.phase==="draw")dir.d.e[o.u]=1;if(dir.phase==="ask")dir.d.a[o.u]=t.slice(0,60);readComment(o,t)}
 else if(ev.type==="like"){const F=LZ("like",["puan","kalp","konus"]),c=Math.max(1,ev.count||1);if(F.includes("puan"))add(o,Math.min(c,20));if(F.includes("kalp"))hearts(Math.min(c,8),780,1400,70);if(F.includes("patlama"))burst(450,640,16,{t:"s",v:500,g:160});if(F.includes("konus")&&Math.random()<.12)speak(fill(pick(PP.lk),{n}),{pr:0,ex:"shy",emo:.5})}
 else if(ev.type==="share"){const F=LZ("share",["puan","kalp","konus"]);if(F.includes("puan"))add(o,20);if(F.includes("kalp"))hearts(10,450,700,200);if(F.includes("patlama"))burst(450,640,16,{t:"s",v:500,g:160});if(F.includes("konus"))speak(fill(pick(PP.sh),{n}),{pr:2,ex:"joy",g:"clap",emo:1.4})}
 else if(ev.type==="follow"){const F=LZ("follow",["puan","kalp","patlama","konus"]);if(F.includes("puan"))add(o,30);if(F.includes("kalp"))hearts(12,450,700,200);if(F.includes("patlama"))burst(450,640,22,{t:"s",v:600,g:200});if(F.includes("konus"))speak(fill(pick(PP.fol),{n}),{pr:2,ex:"shy",g:"kyaa",gm:3.5,emo:1.4})}
 else if(ev.type==="gift"){Rex.giftCard(o.n,ev.gift,ev.icon,ev.count,"lazer");onGift(o,ev)}}

let last=performance.now();
function loop(now){requestAnimationFrame(loop);if(!C.shake){shake=0;flash=Math.min(flash,.5)}const dt=Math.min((now-last)/1000,.05);last=now;R.update(dt);flash=Math.max(0,flash-dt*1.6);$("flash").style.opacity=flash*.6;shake=Math.max(0,shake-dt*2);art.style.transform=shake?`translate(${rnd(-1,1)*shake*10}px,${rnd(-1,1)*shake*8}px)`:"";drawP(dt)}
setInterval(()=>{if(!unlocked||talking||busy)return;const r=Math.random();if(C.autoActs&&r<.2){R.frenzy(.6);R.gesture(pick(["beat","cheer","hair","kyaa","heart"]),4);return}if(r<.3)R.expr("wink",900);else if(r<.6){R.gesture("hair",2.4);R.expr("flirt",2200)}else if(r<.8)R.expr("shy",1500);else R.expr("smile",1500)},7000);
requestAnimationFrame(loop);renderCard();renderLb();$("gv_dia").textContent="0 / "+fmt(C.diaGoal);$("gv_like").textContent="0 / "+fmt(C.likeGoal);
