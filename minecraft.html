<style>

.chip small{display:block;font-size:9px;font-weight:900;letter-spacing:1px;color:#ffe8a0}.chip b{font-size:18px}
#bar{flex:1;align-self:center;height:12px;background:#0008;border:2px solid #fff6;border-radius:8px;overflow:hidden}

#feed div{margin-bottom:3px;animation:fo 5s forwards}@keyframes fo{0%,70%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:clamp(26px,8vw,46px);font-weight:1000;font-style:italic;color:#fff3a0;text-shadow:0 0 10px #ff9f1c,0 3px 0 #a33;opacity:0;pointer-events:none;transition:opacity .3s}

#tm{position:fixed;right:8px;top:calc(62px + env(safe-area-inset-top));font-size:10px;font-weight:800;background:#0008;border:1px solid #fff5;border-radius:8px;padding:4px 7px;color:#bfe9ff}
#ui{display:none}#tm{display:none}
:root{--u:min(1vw,.5625vh)}
.lg{position:fixed;display:flex;flex-direction:column;gap:calc(var(--u)*1.3);align-items:center;pointer-events:none;z-index:4}
.lg div{text-align:center;font-size:calc(var(--u)*1.75);font-weight:900;text-shadow:0 0 4px #000,0 0 4px #000,0 0 3px #000;line-height:1.15}
.lg img{display:block;width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);object-fit:contain;margin:0 auto;filter:drop-shadow(0 2px 3px #0008)}
.lg i{display:block;font-style:normal;font-size:calc(var(--u)*6);line-height:1.1;filter:drop-shadow(0 2px 3px #0008)}
#lgR{right:calc(var(--u)*1.5);top:30%;width:calc(var(--u)*14)}#lgL{left:calc(var(--u)*1.5);top:44%;width:calc(var(--u)*13)}
#tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(100px + env(safe-area-inset-top));display:none;align-items:center;gap:8px;background:rgba(0,0,0,.6);border-radius:99px;padding:5px 16px 5px 8px;font-size:calc(var(--u)*1.7);font-weight:700;white-space:nowrap;pointer-events:none;max-width:96%;z-index:4}#tip i{font-style:normal;font-size:calc(var(--u)*3.2);display:grid;place-items:center}#tip img{width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);object-fit:contain}#tip b{color:#ffd86b}
#lb{position:fixed;right:8px;top:calc(62px + env(safe-area-inset-top));background:#000a;border:2px solid #ffd45c;border-radius:10px;padding:4px 9px;font-size:12px;font-weight:800;display:none;pointer-events:none}#lb small{display:block;font-size:9px;letter-spacing:1px;color:#ffe8a0}#lb b{color:#ffe45c}
#ann{position:fixed;left:0;right:0;top:24%;text-align:center;font-size:clamp(24px,7vw,42px);font-weight:1000;color:#fff;text-shadow:0 0 12px #5fe36a,0 3px 0 #164;opacity:0;pointer-events:none;padding:0 10px;z-index:5}
#mute{position:fixed;right:12px;bottom:190px;width:42px;height:42px;border-radius:50%;border:1px solid #fff3;background:#000a;color:#fff;font-size:18px;z-index:9999}
</style></head><body data-fs-bottom="130px">
<canvas id="c"></canvas>
<div id="top"><div class="chip"><small>BLOK</small><b id="bk">0/400</b></div><div id="bar"><i id="bi"></i></div><div class="chip"><small>SEVİYE</small><b id="lv">1</b></div></div>
<div id="feed"></div><div id="tip"></div><div id="lb"></div><div id="ann"></div><div class="lg" id="lgR"></div><div class="lg" id="lgL"></div><button id="mute" aria-label="Ses">🔊</button><div id="banner"></div><div id="tm">TEST MODU · dokun: gizle</div>
<div id="ui">
<button data-g="bomb" style="background:#42485f"><i>💣</i>Bomba</button>
<button data-g="tnt" style="background:#8c2a22"><i>🧨</i>TNT</button>

</div>
<script src="/common.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
const COLS=10,MAXR=40,GOAL=COLS*MAXR;
let W,H,s,ox,baseY,cb=0,level=1,shake=0,flash=0,speed=1,speedT=0,T=0,celebT=0,celebBurst=0;
const h=new Int16Array(COLS);let grid=[];const pop=new Map();
const bombs=[],parts=[],deb=[],bolts=[];
let seed=7;const rng=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---------- 16x16 piksel dokular ---------- */
const TEX={},NAMES=['','grass','dirt','stone','cobble','coal','iron','gold','diamond','emerald','planks','brick','obsidian','tnt','frame'];
function mk(n,fn){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');fn(x);TEX[n]=c;return c}
function noise(x,b,cols,a){x.fillStyle=b;x.fillRect(0,0,16,16);for(let i=0;i<16;i++)for(let j=0;j<16;j++)if(rng()<a){x.fillStyle=cols[(rng()*cols.length)|0];x.fillRect(i,j,1,1)}}
function bevel(x){x.fillStyle='rgba(255,255,255,.22)';x.fillRect(0,0,16,1);x.fillRect(0,0,1,16);x.fillStyle='rgba(0,0,0,.3)';x.fillRect(0,15,16,1);x.fillRect(15,0,1,16)}
function ore(x,c1,c2){noise(x,'#8a8d90',['#76797c','#9ea1a4'],.5);for(let k=0;k<6;k++){const a=2+(rng()*11|0),b=2+(rng()*11|0);x.fillStyle=c1;x.fillRect(a,b,2,2);x.fillRect(a+1,b-1,1,1);x.fillStyle=c2;x.fillRect(a,b,1,1)}}
mk('dirt',x=>{noise(x,'#8b5a35',['#6d4526','#a06b42','#7a4d2c'],.55);bevel(x)});
mk('grass',x=>{noise(x,'#8b5a35',['#6d4526','#a06b42'],.5);for(let i=0;i<16;i++){const l=4+(rng()*3|0);for(let j=0;j<l;j++){x.fillStyle=['#5fa83a','#4e9030','#79c04a'][(rng()*3)|0];x.fillRect(i,j,1,1)}}bevel(x)});
mk('stone',x=>{noise(x,'#8a8d90',['#76797c','#9ea1a4','#818487'],.55);bevel(x)});
mk('cobble',x=>{noise(x,'#7c7f82',['#8e9194'],.3);for(let k=0;k<9;k++){x.fillStyle=k%2?'#5d6063':'#a2a5a8';x.fillRect(rng()*13|0,rng()*13|0,3,2)}bevel(x)});
mk('coal',x=>{ore(x,'#262626','#444');bevel(x)});mk('iron',x=>{ore(x,'#d8a881','#f0d0b0');bevel(x)});
mk('gold',x=>{ore(x,'#fcd34a','#fff1a0');bevel(x)});mk('diamond',x=>{ore(x,'#3fe8e0','#d8ffff');bevel(x)});mk('emerald',x=>{ore(x,'#2ecc71','#b8ffd0');bevel(x)});
mk('planks',x=>{x.fillStyle='#b8893f';x.fillRect(0,0,16,16);x.fillStyle='#8c6428';for(let y=3;y<16;y+=4)x.fillRect(0,y,16,1);for(let y=0;y<4;y++)x.fillRect((y*5+3)%16,y*4,1,3);noise(x,'rgba(0,0,0,0)',['rgba(255,255,255,.08)','rgba(0,0,0,.08)'],.3);bevel(x)});
mk('brick',x=>{x.fillStyle='#a3432f';x.fillRect(0,0,16,16);x.fillStyle='#d9c3b0';for(let y=0;y<16;y+=5){x.fillRect(0,y,16,1);const o=(y/5|0)%2?4:10;x.fillRect(o,y,1,5)}bevel(x)});
mk('obsidian',x=>{noise(x,'#1b1030',['#2d1b4e','#0f0820','#3d2a6b'],.5);bevel(x)});
mk('tnt',x=>{x.fillStyle='#d9382c';x.fillRect(0,0,16,16);x.fillStyle='#b02a20';for(let i=0;i<16;i+=3){x.fillRect(i,0,1,5);x.fillRect(i,11,1,5)}x.fillStyle='#f2e8d8';x.fillRect(0,5,16,6);x.fillStyle='#222';x.font='bold 6px monospace';x.textBaseline='top';x.fillText('TNT',1,5);bevel(x)});
mk('frame',x=>{noise(x,'#454a56',['#3a3f4a','#555b68'],.4);x.fillStyle='#c0362c';x.fillRect(0,6,16,3);x.fillStyle='#e0584c';x.fillRect(0,6,16,1);x.fillStyle='#a5acba';[[1,1],[13,1],[1,13],[13,13]].forEach(p=>x.fillRect(p[0],p[1],2,2));bevel(x)});
function pickT(r){const b=r/MAXR,q=rng();if(r==0)return 1;if(b<.12)return q<.8?2:3;if(b<.35)return q<.5?3:q<.75?4:q<.88?5:10;if(b<.6)return q<.35?3:q<.5?6:q<.65?5:q<.78?7:q<.9?4:11;if(b<.85)return q<.3?6:q<.5?7:q<.7?8:q<.85?9:12;return q<.3?8:q<.55?9:q<.75?7:12}
const img=(t,x,y,w,hh)=>g.drawImage(t,x,y,w,hh);

/* ---------- ölçek ---------- */
function rs(){const d=Math.min(devicePixelRatio||1,Math.max(1,+(window.mcPR?window.mcPR():2)));W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);g.imageSmoothingEnabled=false;s=Math.min(W*.72/(COLS+2.2),H*.9/16);ox=(W-COLS*s)/2;baseY=H-84-s}
addEventListener('resize',rs);rs();
const SY=r=>baseY-(r-cb)*s;

/* ---------- oyuncu ---------- */
const P={x:.5,y:0,vx:0,vy:0,dir:1,anim:0,walk:false,cd:.4,armT:0,hurt:0,celeb:0};
const col=x=>Math.max(0,Math.min(COLS-1,Math.floor(x)));
function addBlock(c,t){const r=h[c];(grid[r]||(grid[r]=new Uint8Array(COLS)))[c]=t||pickT(r);h[c]++;pop.set(r*COLS+c,0);P.armT=.25;for(let i=0;i<4;i++)puff(c+.5+(rng()-.5)*.8,r+.1,'#cfc3a8')}
function puff(x,y,c){if(parts.length<350)parts.push({x,y,vx:(rng()-.5)*1.5,vy:rng()*1.5,l:.4,m:.4,c,sz:.12,g:0})}
function ai(dt){
  let R=1e9;for(let i=0;i<COLS;i++)if(h[i]<R)R=h[i];
  if(R>=MAXR){celebT=3.6;celebBurst=0;P.celeb=1;window.mcDone&&window.mcDone();$('banner').textContent='🏆 KULE TAMAMLANDI! 🏆';$('banner').style.opacity=1;return}
  const c=col(P.x);let tc=-1,bd=1e9;
  for(let i=0;i<COLS;i++)if(h[i]==R){const d=Math.abs(i-c)+((i-c)*P.dir<0?.3:0)+(i==c?.01:0);if(d<bd){bd=d;tc=i}}
  const gr=P.vy==0&&Math.abs(P.y-h[c])<.06;P.walk=false;
  if(tc!=c&&Math.abs(tc-c)>=2){const sg=Math.sign(tc-c);P.dir=sg;P.x+=sg*5.5*speed*dt;P.walk=true}
  else if(tc!=c){P.dir=Math.sign(tc-c);const d=c+.5-P.x;if(Math.abs(d)>.05){P.x+=Math.sign(d)*Math.min(Math.abs(d),4*dt*speed);P.walk=true}if(P.cd<=0&&gr){addBlock(tc);P.cd=.28/speed}}
  else if(P.cd<=0&&gr){addBlock(c);P.cd=.32/speed}
}
function hurt(cx,cy,r){const d=Math.hypot(P.x-cx,P.y+.8-cy);if(d<r+1.2){P.vy=10;P.vx=(P.x>=cx?1:-1)*(3+rng()*3);P.hurt=1.4}}

/* ---------- efektler ---------- */
let AC;function snd(f,d){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const so=AC.createBufferSource(),fl=AC.createBiquadFilter();fl.frequency.value=f;so.buffer=b;so.connect(fl);fl.connect(AC.destination);so.start()}catch(e){}}
const FIRE=['#fff6b0','#ffd23f','#ff8a1f','#e8441c','#555','#888'];
function boom(cx,cy,r,big){let n=0;
  for(let c=Math.max(0,Math.floor(cx-r));c<=Math.min(COLS-1,Math.ceil(cx+r));c++){const dx=c+.5-cx;if(Math.abs(dx)>r)continue;const nh=Math.max(0,Math.ceil(cy-Math.sqrt(r*r-dx*dx)));
    while(h[c]>nh){h[c]--;if(n++<(big?80:36))deb.push({x:c+.5,y:h[c]+.5,vx:dx*2.5+(rng()-.5)*3,vy:4+rng()*8,t:grid[h[c]][c],a:rng()*6,l:1.8})}}
  const k=big?70:30;for(let i=0;i<k&&parts.length<350;i++){const a=rng()*6.28,v=(1+rng()*4)*r*.5;parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v+1,l:.5+rng()*.6,m:1.1,c:FIRE[(rng()*6)|0],sz:.2+rng()*.3,g:-1})}
  shake=Math.max(shake,big?16:9);flash=Math.max(flash,big?.75:.45);snd(big?500:900,big?.9:.55);hurt(cx,cy,r);
}
function dig(c,n){while(n-->0&&h[c]>0){h[c]--;deb.push({x:c+.5,y:h[c]+.5,vx:(rng()-.5)*5,vy:3+rng()*6,t:grid[h[c]][c],a:0,l:1.5})}}
function drop(k,c){bombs.push({k,c,x:c+.5,y:cb+H/s+2,vy:0,st:0,f:1.5})}
function lightning(c){bolts.push({c,l:.4});dig(c,3);if(c>0)dig(c-1,1);if(c<COLS-1)dig(c+1,1);flash=.6;shake=Math.max(shake,6);snd(1600,.5);hurt(c+.5,h[c],1)}
function feed(t){const f=$('feed'),d=document.createElement('div');d.textContent=t;f.appendChild(d);setTimeout(()=>d.remove(),5000);while(f.children.length>4)f.firstChild.remove()}
/* ===== RexStüdyo bağlantısı: olaylar, hediyeler, ses, yapay zeka sunucu ===== */
const R=window.Rex,QS=new URLSearchParams(location.search);
const DEFG=[{n:"Rose,Gül",e:"build",l:"BLOK YAĞMURU",d:"Kuleye 10 blok eklenir",s:1},{n:"Perfume,Parfüm",e:"bomb",l:"BOMBA",d:"Kuleye bomba düşer",s:1},{n:"Doughnut,Donut",e:"speed",l:"HIZ",d:"Karakter 8 sn hızlanır",s:1},{n:"Hand Hearts,El Kalpleri",e:"diamond",l:"ELMAS BLOK",d:"5 elmas blok eklenir",s:1},{n:"Galaxy,Galaksi",e:"storm",l:"FIRTINA",d:"3 şimşek çakar",s:1},{n:"TikTok",e:"tnt",l:"TNT",d:"Dev TNT düşer",s:1},{n:"Lion,Aslan",e:"nuke",l:"NÜKLEER TNT",d:"Kuleyi sarsan dev patlama",s:1}];
const DEF={likes:10,cap:60,pr:2,fps:60,persist:true,base:1,nameTag:true,pname:"Usta",ev:{like:"block1",comment:"block1",follow:"build",share:"speed",join:"none"},legend:true,tips:true,shake:true,lb:true,feed:true,spk:true,ai:true,chatter:true,gifts:null};
let CF=null,LG="";
const mcLoad=()=>{let k={};try{k=JSON.parse(localStorage.getItem("rex_cfg")||"{}")}catch(e){}if(R&&k&&typeof k==="object")Object.assign(R.cfg,k);const m=(R&&R.cfg&&R.cfg.mc)||{};CF=Object.assign({},DEF,m,{ev:Object.assign({},DEF.ev,m.ev||{})})};
const cf=()=>CF||(mcLoad(),CF);addEventListener("storage",()=>{mcLoad();LG=""});
const EE={block1:"🧱",build:"🧱",diamond:"💎",rain:"🌧️",bomb:"💣",tnt:"🧨",light:"⚡",storm:"⛈️",speed:"🚀",nuke:"☢️",fireworks:"🎆",jump:"🦘",gold:"🪙",emerald:"💚",obsidian:"🟪",creeper:"💥"};
const EL={block1:"+1 BLOK",build:"+10 BLOK",diamond:"ELMAS BLOK",rain:"+25 BLOK",bomb:"BOMBA",tnt:"TNT",light:"ŞİMŞEK",storm:"FIRTINA",speed:"HIZ",nuke:"NÜKLEER TNT",fireworks:"HAVAİ FİŞEK",jump:"ZIPLAMA",gold:"ALTIN BLOK",emerald:"ZÜMRÜT BLOK",obsidian:"OBSİDYEN",creeper:"CREEPER"};
const MSG={block1:"blok koydu",build:"blok yağdırdı",diamond:"elmas blok ekledi",rain:"mega blok yağmuru başlattı",bomb:"bomba attı",tnt:"TNT attı",light:"şimşek çaktı",storm:"fırtına çıkardı",speed:"karakteri hızlandırdı",nuke:"nükleer TNT attı",fireworks:"havai fişek patlattı",jump:"karakteri zıplattı",gold:"altın blok ekledi",emerald:"zümrüt blok ekledi",obsidian:"obsidyen ekledi",creeper:"creeper saldırttı"};
const escH=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=u=>String(u||"izleyici").replace(/[<>]/g,"").replace(/\s+/g," ").trim().slice(0,18)||"izleyici";
const BAD=/(\bamk|\baq\b|orospu|\bsik|piç|yarrak|\bgöt)/i;
/* efektler */
function mcFill(n,t){for(let i=0;i<n;i++)setTimeout(()=>{let c=-1,m=1e9;for(let j=0;j<COLS;j++){const v=h[j]+rng()*.9;if(h[j]<MAXR&&v<m){m=v;c=j}}if(c>=0){addBlock(c,t);if(i%4==0)snd(500,.08)}},i*70)}
const rc=()=>(rng()*COLS)|0;
const FX={gold:()=>mcFill(8,7),emerald:()=>mcFill(8,9),obsidian:()=>mcFill(6,12),creeper:()=>{ann("💥 CREEPER!");drop("tnt",col(P.x))},block1:()=>mcFill(1),build:()=>mcFill(10),rain:()=>mcFill(25),diamond:()=>mcFill(5,8),bomb:()=>drop("bomb",rc()),tnt:()=>drop("tnt",rc()),light:()=>lightning(rc()),
 storm:()=>[0,1,2].forEach(i=>setTimeout(()=>lightning(rc()),i*350)),speed:()=>{speed=2.2;speedT=8},nuke:()=>{for(let i=0;i<4;i++)setTimeout(()=>drop("tnt",rc()),i*250)},
 jump:()=>{P.vy=11;P.hurt=0},fireworks:()=>{for(let k=0;k<5;k++)setTimeout(()=>{const bx=rng()*COLS,by=cb+(H/s)*(.3+rng()*.4),cl=["#ff5","#5ff","#f5f","#5f5","#f85"][(rng()*5)|0];for(let i=0;i<30&&parts.length<350;i++){const a=rng()*6.28,v=2+rng()*4;parts.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.9,m:.9,c:cl,sz:.14,g:1})}snd(900,.2)},k*220)}};
const Q=[];function mcRun(e,u){if(FX[e]&&Q.length<(+cf().cap||60))Q.push([e,u])}
setInterval(()=>{const it=Q.shift();if(it){try{FX[it[0]](it[1])}catch(e){}}},260);
/* skor */
const sco={};const mcScore=(u,p)=>{sco[u]=(sco[u]||0)+p};
setInterval(()=>{const l=$("lb"),c=cf();$("feed").style.display=c.feed?"":"none";if(!c.shake)shake=0;if(!c.lb){l.style.display="none";return}const t=Object.entries(sco).sort((a,b)=>b[1]-a[1]).slice(0,3);l.style.display=t.length?"block":"none";l.innerHTML="<small>EN ÇOK DESTEK</small>"+t.map((x,i)=>"<div>"+["🥇","🥈","🥉"][i]+" "+escH(x[0])+" <b>"+x[1]+"</b></div>").join("")},1500);
/* ekran duyurusu */
let annT;function ann(t){const a=$("ann");a.textContent=t;a.style.transition="none";a.style.opacity=1;a.style.transform="scale(1.2)";requestAnimationFrame(()=>requestAnimationFrame(()=>{a.style.transition="all .35s";a.style.transform="scale(1)"}));clearTimeout(annT);annT=setTimeout(()=>a.style.opacity=0,2300)}
